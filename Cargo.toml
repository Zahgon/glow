[package]
name = "glow"
version = "3.0.0"
edition = "2021"
rust-version = "1.85"
description = "Render markdown on the CLI, with pizzazz!"
license = "MIT"
repository = "https://github.com/charmbracelet/glow"
readme = "README.md"
resolver = "3"

[[bin]]
name = "glow"
path = "src/main.rs"

[lib]
name = "glow"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
ignore = "0.4"
libc = "0.2"
notify = "6"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
unicode-normalization = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = { version = "2", features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
